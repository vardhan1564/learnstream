spring.application.name=LearnStream-Backend
server.port=${PORT:8080}

# ---------------------------------------------------------------
# Secrets live in secrets.properties in the project root folder (NOT committed to git, NOT packaged in the jar)
# or in environment variables. See secrets.properties.example.
# ---------------------------------------------------------------
spring.config.import=optional:file:./secrets.properties
# We use JWT login, not Spring's default generated user/password
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# ---------------- Database ----------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/learnstream_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:tiger}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Uploads (admin video uploads). Large files are streamed to a temp file on disk, not kept in memory.
spring.servlet.multipart.max-file-size=${MAX_VIDEO_MB:2048}MB
spring.servlet.multipart.max-request-size=${MAX_VIDEO_MB:2048}MB
spring.servlet.multipart.file-size-threshold=1MB
server.tomcat.max-swallow-size=-1
server.tomcat.connection-timeout=120s

# ---------------- Mail (OTP) ----------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Set to false (MAIL_ENABLED=false) to print OTPs in the server console instead of emailing them - handy for local testing without Gmail.
learnstream.mail.enabled=${MAIL_ENABLED:true}

# ---------------- Security ----------------
# Must be at least 32 characters. Generate one with:  openssl rand -hex 32
learnstream.jwt.secret=${JWT_SECRET:change-me-please-use-a-long-random-secret-of-64-chars-minimum}
learnstream.jwt.expiration-hours=24
# Comma-separated list of frontend URLs allowed to call this API
learnstream.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
# Public URL of the frontend (used for Stripe redirects and certificate verification links)
learnstream.frontend-url=${FRONTEND_URL:http://localhost:5173}

# First admin account - created automatically on startup if no admin exists
learnstream.admin.email=${ADMIN_EMAIL:}
learnstream.admin.password=${ADMIN_PASSWORD:}
learnstream.admin.name=${ADMIN_NAME:Platform Admin}
# Adds a sample course, problem, quiz and roadmap when the database is empty
learnstream.seed-demo-data=${SEED_DEMO_DATA:true}

# ---------------- Learning rules ----------------
# Solve this many distinct coding problems to earn 1 free course
learnstream.reward.problems-per-free-course=5
# Students must pass every quiz attached to a course before downloading its certificate
learnstream.certificate.require-quiz-pass=true

# ---------------- Video storage ----------------
# local = save uploaded videos on this server's disk (good for development / a VPS with a persistent disk)
# s3    = Cloudflare R2, AWS S3, Backblaze B2, Wasabi... (recommended for hosting; nothing is stored in the database except the file key)
learnstream.storage.type=${STORAGE_TYPE:local}
learnstream.storage.local-dir=${STORAGE_LOCAL_DIR:./uploads}
# Cloudflare R2 example: endpoint=https://<ACCOUNT_ID>.r2.cloudflarestorage.com  region=auto
learnstream.storage.s3.endpoint=${S3_ENDPOINT:}
learnstream.storage.s3.region=${S3_REGION:auto}
learnstream.storage.s3.bucket=${S3_BUCKET:}
learnstream.storage.s3.access-key=${S3_ACCESS_KEY:}
learnstream.storage.s3.secret-key=${S3_SECRET_KEY:}
# How long a student's video link stays valid. Links are generated fresh each time the lesson page loads.
learnstream.storage.url-expiry-minutes=240
# Public URL of THIS backend (used to build video links for local storage)
learnstream.backend-url=${BACKEND_URL:http://localhost:8080}

# ---------------- Stripe ----------------
stripe.api.key=${STRIPE_SECRET_KEY:}
# Optional: set to enable the webhook at POST /api/payments/webhook (recommended in production)
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.currency=inr

# ---------------- Code execution (Judge0) ----------------
# Free public instance (rate limited):   https://ce.judge0.com
# RapidAPI:  https://judge0-ce.p.rapidapi.com  + judge0.api-key + judge0.api-host=judge0-ce.p.rapidapi.com
# Self-hosted: http://your-server:2358 (+ judge0.auth-token if AUTHN is enabled)
judge0.base-url=${JUDGE0_URL:https://ce.judge0.com}
judge0.api-key=${JUDGE0_API_KEY:}
judge0.api-host=${JUDGE0_API_HOST:}
judge0.auth-token=${JUDGE0_AUTH_TOKEN:}
# Judge0 language ids (these exist on every Judge0 1.x instance; 91 = Java 17 / 92 = Python 3.11 on newer ones)
judge0.language.java=62
judge0.language.python=71
judge0.language.cpp=54
judge0.language.javascript=63
judge0.cpu-time-limit=5
judge0.timeout-seconds=30

logging.level.com.learnsstream=INFO

# Behind a reverse proxy / load balancer (Nginx, Render, Railway...) uncomment so client IPs are correct:
# server.forward-headers-strategy=native
